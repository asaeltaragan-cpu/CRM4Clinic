name: Sync leads from Apify → Supabase

# מריץ פעם ביום את ה-Edge Function sync-apify-leads (Google Maps → leads table).
# ה-anon key כאן מיועד לחשיפה ציבורית מטבעו (publishable key) — לא סוד.
# אפשר גם להריץ ידנית מטאב Actions ב-GitHub ("Run workflow").

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC = 09:00 שעון ישראל (בערך, ללא DST)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: [sync-apify-leads] # sync-osm-leads רץ רק מהדמו (Overpass חוסם IP של Supabase)
    steps:
      - name: Call ${{ matrix.function }} Edge Function
        env:
          SUPABASE_ANON_KEY: sb_publishable_Ec8hGZDXy_qNv7rBfMA9bA_oHip0-Zi
          FUNCTION_URL: https://qprifajxctsbjnnqvgpq.supabase.co/functions/v1/${{ matrix.function }}
        run: |
          response=$(curl -sS -w "\n%{http_code}" -X POST "$FUNCTION_URL" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "HTTP $status"
          echo "$body"
          if [ "$status" -ge 400 ]; then
            echo "::error::${{ matrix.function }} failed with HTTP $status"
            exit 1
          fi
